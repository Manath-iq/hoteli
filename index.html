<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <title>Friendly Thug 52 NGG</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="theater" id="theater" aria-label="Видеоэдит Friendly Thug 52 NGG">
    <div class="screen" id="screen">
      <video id="video" src="friendly.MP4" playsinline preload="metadata" poster="assets/cover.jpg" aria-label="Friendly Thug 52 NGG"></video>
      <img class="insert" id="city" src="assets/petersburg.webp" alt="">
      <img class="insert" id="ocean" src="assets/ocean.webp" alt="">
      <div class="shade" aria-hidden="true"></div>
      <div class="cover" id="cover">
        <h1>Friendly<br>Thug</h1><span>52 NGG</span>
      </div>
      <div class="lyric" id="lyric" hidden></div>
      <button class="surface" id="surface" aria-label="Воспроизвести"></button>
      <div class="controls" id="controls">
        <button id="play" aria-label="Воспроизвести">
          <svg viewBox="0 0 24 24" fill="currentColor"><path class="play-glyph" d="M7 4v16l13-8z"/><path class="pause-glyph" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <time id="time">0:00 / 0:51</time>
        <div class="timeline"><canvas id="wave" aria-hidden="true"></canvas><input type="range" id="seek" aria-label="Перемотка" min="0" max="51.2" value="0" step="0.01"></div>
        <button id="mute" aria-label="Выключить звук">
          <svg viewBox="0 0 24 24" class="outline"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="sound-glyph" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="mute-glyph" d="m16 9 6 6m0-6-6 6"/></svg>
        </button>
        <button id="full" aria-label="Полный экран">
          <svg viewBox="0 0 24 24" class="outline"><path d="M3 9V4h6m6 0h6v5m0 6v5h-6m-6 0H3v-5"/></svg>
        </button>
      </div>
      <p id="error" role="status" hidden></p>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
